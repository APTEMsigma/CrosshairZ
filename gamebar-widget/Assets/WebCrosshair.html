<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            user-select: none !important;
            -webkit-user-select: none !important;
            pointer-events: none !important;
            cursor: none !important;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none !important;
            cursor: none !important;
        }
        #container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none !important;
        }
        svg, svg * {
            overflow: visible;
            pointer-events: none !important;
        }
        #crosshairImg {
            display: none;
            position: absolute;
            pointer-events: none !important;
            user-select: none !important;
            max-width: none !important;
            max-height: none !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <svg id="crosshairSvg" width="100%" height="100%"></svg>
        <img id="crosshairImg" alt="" draggable="false" />
    </div>
    <script>
        const svg = document.getElementById('crosshairSvg');
        const img = document.getElementById('crosshairImg');
        let lastJsonStr = '';
        let currentCrosshair = null;
        let currentImage = null;

        function updateViewBox() {
            const w = window.innerWidth || 640;
            const h = window.innerHeight || 640;
            svg.setAttribute('viewBox', `${-w / 2} ${-h / 2} ${w} ${h}`);
        }
        window.addEventListener('resize', () => {
            updateViewBox();
            if (currentImage && currentImage.enabled && currentImage.src) {
                renderImage(currentImage);
            } else if (currentCrosshair) {
                renderCrosshair(currentCrosshair);
            }
        });
        updateViewBox();

        function renderImage(imgCfg) {
            currentImage = imgCfg;
            if (!imgCfg || !imgCfg.enabled || !imgCfg.src) {
                img.style.display = 'none';
                svg.style.display = 'block';
                return;
            }

            svg.style.display = 'none';
            if (img.src !== imgCfg.src) {
                img.src = imgCfg.src;
            }
            const scale = Number.isFinite(imgCfg.scale) ? imgCfg.scale : 1.0;
            const baseSize = 256;
            const w = baseSize * scale;
            img.style.width = w + 'px';
            img.style.height = 'auto';
            const opacity = Number.isFinite(imgCfg.opacity) ? Math.max(0.01, Math.min(1, imgCfg.opacity)) : 1.0;
            img.style.opacity = opacity;
            const offX = Number.isFinite(imgCfg.offsetX) ? imgCfg.offsetX : 0;
            const offY = Number.isFinite(imgCfg.offsetY) ? imgCfg.offsetY : 0;
            const angle = Number.isFinite(imgCfg.angle) ? imgCfg.angle : 0;
            img.style.transform = `translate(${offX}px, ${offY}px) rotate(${angle}deg)`;
            img.style.display = 'block';
        }

        function renderCrosshair(c) {
            if (!c) return;
            currentCrosshair = c;
            img.style.display = 'none';
            svg.style.display = 'block';

            const t = Math.max(0.1, Number.isFinite(c.thickness) ? c.thickness : 2);
            const gap = Math.max(0, Number.isFinite(c.gap) ? c.gap : 6);
            const len = Math.max(0.1, Number.isFinite(c.length) ? c.length : 14);
            const round = Math.max(0, Math.min(100, Number.isFinite(c.roundness) ? c.roundness : 0)) / 100;
            const size = Math.max(0.5, Number.isFinite(c.size) ? c.size : 24);
            const rot = c.rotation || 0;
            const color = c.color || '#00e676';
            const opacity = Number.isFinite(c.opacity) ? c.opacity : 1;
            const outline = c.outline || { enabled: true, thickness: 2, color: '#000000', opacity: 0.75 };
            const dot = c.centerDot || { enabled: false, size: 4, shape: 'circle', color: '#ffffff' };

            let prims = [];
            switch (c.shape) {
                case 'dot':
                    prims.push({ kind: 'disc', r: size / 2 });
                    break;
                case 'circle':
                    prims.push({ kind: 'ring', r: Math.max(0.5, size / 2 - t / 2) });
                    break;
                case 'square':
                    prims.push({ kind: 'square', half: Math.max(0.5, size / 2 - t / 2), rx: round * (size / 2 - t / 2) });
                    break;
                case 'chevron':
                    prims.push({ kind: 'rect', x: -t / 2, y: gap, w: t, h: len, rx: round * (t / 2), rot: -45 });
                    prims.push({ kind: 'rect', x: -t / 2, y: gap, w: t, h: len, rx: round * (t / 2), rot: 45 });
                    break;
                case 't':
                    prims.push({ kind: 'rect', x: -(gap + len), y: -t / 2, w: len, h: t, rx: round * (t / 2) });
                    prims.push({ kind: 'rect', x: gap, y: -t / 2, w: len, h: t, rx: round * (t / 2) });
                    prims.push({ kind: 'rect', x: -t / 2, y: gap, w: t, h: len, rx: round * (t / 2) });
                    break;
                case 'cross':
                default:
                    prims.push({ kind: 'rect', x: -t / 2, y: -(gap + len), w: t, h: len, rx: round * (t / 2) });
                    prims.push({ kind: 'rect', x: -t / 2, y: gap, w: t, h: len, rx: round * (t / 2) });
                    prims.push({ kind: 'rect', x: -(gap + len), y: -t / 2, w: len, h: t, rx: round * (t / 2) });
                    prims.push({ kind: 'rect', x: gap, y: -t / 2, w: len, h: t, rx: round * (t / 2) });
                    break;
            }

            function drawPrim(p, col, th, o) {
                if (p.kind === 'rect') {
                    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    r.setAttribute('x', p.x - o);
                    r.setAttribute('y', p.y - o);
                    r.setAttribute('width', Math.max(0.1, p.w + 2 * o));
                    r.setAttribute('height', Math.max(0.1, p.h + 2 * o));
                    r.setAttribute('rx', Math.max(0, (p.rx || 0) + o));
                    r.setAttribute('fill', col);
                    if (p.rot !== undefined) r.setAttribute('transform', `rotate(${p.rot} 0 0)`);
                    return r;
                }
                if (p.kind === 'disc') {
                    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    c.setAttribute('r', Math.max(0.1, p.r + o));
                    c.setAttribute('fill', col);
                    return c;
                }
                if (p.kind === 'ring') {
                    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    c.setAttribute('r', p.r);
                    c.setAttribute('fill', 'none');
                    c.setAttribute('stroke', col);
                    c.setAttribute('stroke-width', Math.max(0.1, th + 2 * o));
                    return c;
                }
                if (p.kind === 'square') {
                    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    r.setAttribute('x', -p.half);
                    r.setAttribute('y', -p.half);
                    r.setAttribute('width', 2 * p.half);
                    r.setAttribute('height', 2 * p.half);
                    r.setAttribute('rx', Math.max(0, (p.rx || 0) + o));
                    r.setAttribute('fill', 'none');
                    r.setAttribute('stroke', col);
                    r.setAttribute('stroke-width', Math.max(0.1, th + 2 * o));
                    return r;
                }
            }

            function drawDot(d, col, o) {
                const half = Math.max(0.25, (d.size || 4) / 2);
                if (d.shape === 'square') {
                    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    const h = half + o;
                    r.setAttribute('x', -h);
                    r.setAttribute('y', -h);
                    r.setAttribute('width', 2 * h);
                    r.setAttribute('height', 2 * h);
                    r.setAttribute('fill', col);
                    return r;
                }
                const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                c.setAttribute('r', half + o);
                c.setAttribute('fill', col);
                return c;
            }

            svg.innerHTML = '';
            const rootG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            if (rot) rootG.setAttribute('transform', `rotate(${rot})`);

            // Outline pass
            if (outline.enabled && (outline.thickness || 0) > 0) {
                const outG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                outG.setAttribute('opacity', outline.opacity !== undefined ? outline.opacity : 0.75);
                const o = outline.thickness;
                const oCol = outline.color || '#000000';
                prims.forEach(p => outG.appendChild(drawPrim(p, oCol, t, o)));
                if (dot.enabled) outG.appendChild(drawDot(dot, oCol, o));
                rootG.appendChild(outG);
            }

            // Main pass
            const mainG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            mainG.setAttribute('opacity', opacity);
            prims.forEach(p => mainG.appendChild(drawPrim(p, color, t, 0)));
            if (dot.enabled) mainG.appendChild(drawDot(dot, dot.color || '#ffffff', 0));
            rootG.appendChild(mainG);

            svg.appendChild(rootG);
        }

        function applyJson(text) {
            if (!text || text === lastJsonStr) return;
            try {
                const data = JSON.parse(text);
                lastJsonStr = text;
                if (data.image && data.image.enabled && data.image.src) {
                    renderImage(data.image);
                } else {
                    currentImage = null;
                    const ch = data.crosshair || data;
                    if (ch && (ch.shape || ch.color)) {
                        renderCrosshair(ch);
                    }
                }
            } catch (e) {}
        }

        async function syncLoop() {
            let fetched = false;

            // 1. Try high-performance local HTTP server (Port 23851) with non-blocking timeout
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60);
                const res = await fetch('http://127.0.0.1:23851/crosshair.json?t=' + Date.now(), { 
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const text = await res.text();
                    applyJson(text);
                    fetched = true;
                }
            } catch (e) {}

            // 2. Fallback to ms-appdata LocalState storage
            if (!fetched) {
                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', 'ms-appdata:///local/crosshair.json?t=' + Date.now(), true);
                    xhr.timeout = 60;
                    xhr.onload = function() {
                        if (xhr.status === 200 || xhr.status === 0) {
                            applyJson(xhr.responseText);
                        }
                    };
                    xhr.send();
                } catch (e) {}
            }

            setTimeout(syncLoop, 50);
        }

        renderCrosshair({ shape: 'cross', size: 24, thickness: 2, gap: 6, length: 14, color: '#00e676', opacity: 1, outline: { enabled: true, thickness: 2, color: '#000000', opacity: 0.75 } });
        syncLoop();
    </script>
</body>
</html>
